{% extends "base.html" %}
{% block content %}

<div class="container my-4">

    <div class="text-end mb-4">

<a href="{{ url_for('reorder_plan_page') }}"
   class="btn btn-outline-dark">

Plan de Reposición Inteligente

</a>

</div>


<h2 class="mb-4">Dashboard</h2>

<div class="row mb-4">

<div class="col-md-4">

<label>Mes</label>

<select id="month-filter" class="form-select">

<option value="">Todos</option>

{% for m in meses %}
<option value="{{m.value}}">
{{m.label}}
</option>
{% endfor %}

</select>

</div>

<div class="col-md-4">

<label>Tipo de prenda</label>

<select id="clothing-filter" class="form-select">

<option value="">Todos</option>

{% for ct in clothing_types %}
<option value="{{ct.id}}">
{{ct.name}}
</option>
{% endfor %}

</select>

</div>

</div>

<div class="card p-3 mb-4">
<h5>Ingresos en el tiempo</h5>
<canvas id="revenueChart"></canvas>
</div>

<div class="row">

<div class="col-md-6">
<div class="card p-3">
<h5>Ventas por Prenda</h5>
<canvas id="clothesChart"></canvas>
</div>
</div>

<div class="col-md-6">
<div class="card p-3">
<h5>Ventas por Talle</h5>
<canvas id="sizeChart"></canvas>
</div>
</div>

</div>

    <div class="card p-3 mt-4">
    <h5>Detalle de Ventas</h5>
    <div class="table-responsive">
        <table class="table table-striped align-middle">
            <thead>
                <tr>
                    <th>Producto</th>
                    <th>Unidades Vendidas</th>
                    <th>Ingresos</th>
                </tr>
            </thead>
            <tbody id="sales-table-body">
            </tbody>
        </table>
    </div>
</div>




</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

let revenueChart;
let clothesChart;
let sizeChart;

function getRandomColor() {
    const colors = [
        "#ff6b00",
        "#111111",
        "#1f2937",
        "#3b82f6",
        "#16a34a",
        "#f59e0b"
    ];
    return colors[Math.floor(Math.random() * colors.length)];
}

async function loadData(){

    const month = document.getElementById("month-filter").value;
    const clothing = document.getElementById("clothing-filter").value;

    const params = new URLSearchParams();

    if(month) params.append("month_year",month);
    if(clothing) params.append("clothing_type_id",clothing);

    const res = await fetch("/analytics/data?"+params.toString());
    const data = await res.json();

    renderRevenue(data.revenue);
    renderClothes(data.clothes);
    renderSizes(data.sizes);
    renderTable(data.table);
}

function renderTable(data){

    const tbody = document.getElementById("sales-table-body");
    tbody.innerHTML = "";

    if(data.length === 0){
        tbody.innerHTML = `
            <tr>
                <td colspan="3" class="text-center text-muted">
                    No hay ventas para los filtros seleccionados
                </td>
            </tr>
        `;
        return;
    }

    data.forEach(item => {

        const row = `
            <tr>
                <td>${item.name}</td>
                <td>${item.units.toLocaleString()}</td>
                <td>$ ${item.revenue.toLocaleString()}</td>
            </tr>
        `;

        tbody.innerHTML += row;
    });
}

function renderRevenue(data){

    if(revenueChart) revenueChart.destroy();

    revenueChart = new Chart(
        document.getElementById("revenueChart"),
        {
            type:"line",
            data:{
                labels:data.labels,
                datasets:[{
                    data:data.values,
                    borderColor:"#ff6b00",
                    backgroundColor:"rgba(255,107,0,0.1)",
                    tension:0.3,
                    fill:true
                }]
            },
            options:{
                plugins:{
                    legend:{
                        display:false
                    }
                }
            }
        }
    );
}


function renderClothes(data){

    if(clothesChart) clothesChart.destroy();

    const colorPalette = [
        "#ff6b00",
        "#111111",
        "#1f2937",
        "#3b82f6",
        "#16a34a",
        "#f59e0b",
        "#dc2626",
        "#9333ea",
        "#0ea5e9",
        "#22c55e"
    ];

    const backgroundColors = data.labels.map((label, index) => {
        if (label === "Otros") return "#6c757d";
        return colorPalette[index % colorPalette.length];
    });

    clothesChart = new Chart(
        document.getElementById("clothesChart"),
        {
            type: "pie",
            data: {
                labels: data.labels,
                datasets: [{
                    data: data.values,
                    backgroundColor: backgroundColors
                }]
            },
            options: {
                plugins: {
                    tooltip: {
                        callbacks: {
                            label: function(context) {

                                const label = context.label;
                                const value = context.raw;

                                const datasetValues = context.dataset.data;
                                const total = datasetValues.reduce((a, b) => a + b, 0);

                                const percentage = ((value / total) * 100).toFixed(2);

                                return `${label}: ${value.toLocaleString()} (${percentage}%)`;
                            }
                        }
                    }
                }
            }
        }
    );
}


function renderSizes(data){

    if(sizeChart) sizeChart.destroy();

    sizeChart = new Chart(
        document.getElementById("sizeChart"),
        {
            type: "pie",
            data: {
                labels: data.labels,
                datasets: [{
                    data: data.values
                }]
            },
            options: {
                plugins: {
                    tooltip: {
                        callbacks: {
                            label: function(context) {

                                const label = context.label;
                                const value = context.raw;

                                const datasetValues = context.dataset.data;
                                const total = datasetValues.reduce((a, b) => a + b, 0);

                                const percentage = ((value / total) * 100).toFixed(2);

                                return `${label}: ${value.toLocaleString()} (${percentage}%)`;
                            }
                        }
                    }
                }
            }
        }
    );
}

document
.getElementById("month-filter")
.addEventListener("change",loadData);

document
.getElementById("clothing-filter")
.addEventListener("change",loadData);

loadData();

</script>


{% endblock %}
